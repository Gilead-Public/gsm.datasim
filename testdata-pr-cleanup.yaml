# name: testdata-pr-cleanup.yaml
# version: 1.0.0
# Description: When a PR closes (merged or not), delete the test data bundles
#   that testdata-pr.yaml built for it. Repos that don't feed the shared gsm
#   test data skip this. Copy to .github/workflows/ in every gsm repo.
on:
  pull_request:
    types: [closed]

name: testdata-pr-cleanup

permissions:
  # write: Required to delete artifacts.
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - id: needs
        uses: gilead-public/gsm.datasim/needs-testdata@actions
      - if: steps.needs.outputs.needed == 'true'
        uses: gilead-public/gsm.datasim/delete-pr-bundles@actions
