name: "Delete PR bundles"
description: "Deletes a PR's test data bundle artifacts (named testdata-pr<number>-<sha>, from build-pr-bundle.yaml), optionally keeping one. Used by build-pr-bundle.yaml after a new bundle supersedes older ones, and by the testdata-pr-cleanup.yaml caller when a PR closes. Needs actions: write."
inputs:
  token:
    description: "Token with actions: write on the repository."
    default: ${{ github.token }}
  repo:
    description: "Repository that owns the artifacts."
    default: ${{ github.repository }}
  pr:
    description: "Pull request number."
    default: ${{ github.event.pull_request.number }}
  keep:
    description: "Artifact name to keep (blank to delete all of the PR's bundles)."
    default: ""
  before-run:
    description: "Only delete artifacts from workflow runs with a lower ID than this (blank for all). Run IDs increase over time, so passing the current run's ID means a slow, older build can never delete a newer build's bundle."
    default: ""
outputs:
  deleted:
    description: "Number of artifacts deleted."
    value: ${{ steps.delete.outputs.deleted }}
  failed:
    description: "Number of artifacts that couldn't be deleted (e.g. read-only token on a fork PR)."
    value: ${{ steps.delete.outputs.failed }}
runs:
  using: "composite"
  steps:
    - name: Delete artifacts
      id: delete
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repo }}
        PR: ${{ inputs.pr }}
        KEEP: ${{ inputs.keep }}
        BEFORE_RUN: ${{ inputs.before-run }}
      run: |
        if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
          echo "::error::pr must be a pull request number (got '$PR')."
          exit 1
        fi
        prefix="testdata-pr$PR-"
        ids=$(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
          --jq ".artifacts[] | select((.name | startswith(\"$prefix\")) and .name != \$ENV.KEEP and (.expired | not) and (\$ENV.BEFORE_RUN == \"\" or .workflow_run.id < (\$ENV.BEFORE_RUN | tonumber))) | \"\(.id) \(.name)\"")
        n=0
        failed=0
        while read -r id name; do
          [ -n "$id" ] || continue
          if gh api -X DELETE "repos/$REPO/actions/artifacts/$id" > /dev/null; then
            n=$((n + 1)); echo "Deleted $name ($id)."
          else
            failed=$((failed + 1))
          fi
        done <<< "$ids"
        echo "deleted=$n" >> "$GITHUB_OUTPUT"
        echo "failed=$failed" >> "$GITHUB_OUTPUT"
        echo "Deleted $n test data bundle artifact(s) for PR #$PR." >> "$GITHUB_STEP_SUMMARY"
        if [ "$failed" -gt 0 ]; then
          # Expected on PRs from forks, whose token is read-only;
          # testdata-pr-cleanup.yaml (pull_request_target) deletes them on close.
          echo "::warning::Could not delete $failed bundle artifact(s) for PR #$PR (read-only token, e.g. a fork PR). They'll be deleted when the PR closes."
        fi
