# name: R-CMD-check.yaml
# version: 1.0.0
# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Description: R CMD check for PRs
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
name: R-CMD-check
permissions: read-all
jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Define matrix based on target branch
        id: set-matrix
        uses: gilead-public/gsm.utils/setup-matrix-with-dev@actions-v1
        with:
          pkg-use: 'public'
  R-CMD-check:
    needs: [setup-matrix]
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}
    env:
      R_KEEP_PKG_SOURCE: yes
    steps:
      - name: Generate token
        uses: gilead-public/gsm.utils/generate-token@actions-v1
        id: token
        with:
          app-id: ${{ secrets.CM_BOT_APP_ID }}
          app-private-key: ${{ secrets.CM_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Check out repo
        uses: gilead-public/gsm.utils/checkout@actions-v1
        with:
          token: ${{ steps.token.outputs.token }}
      - name: Install R and dependencies
        uses: gilead-public/gsm.utils/install@actions-v1
        with:
          token: ${{ steps.token.outputs.token }}
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          extra-packages: any::rcmdcheck
          needs: check
      - name: Set GITHUB_PAT
        shell: bash
        run: echo "GITHUB_PAT=${{ steps.token.outputs.token }}" >> $GITHUB_ENV
      # TEMP (#183 e2e test): wait for testdata-pr.yaml's bundle for this PR
      # head and point gsm.core at it via GSM_TESTDATA_SNAPSHOT.
      - name: Check whether this repo needs test data
        if: github.event_name == 'pull_request'
        id: needs
        uses: gilead-public/gsm.datasim/needs-testdata@feat-183-readiness-checks
      - name: Wait for PR test data bundle
        if: steps.needs.outputs.needed == 'true'
        uses: gilead-public/gsm.datasim/wait-for-bundle@feat-183-readiness-checks
        with:
          token: ${{ github.token }}
      - name: Confirm gsm.core uses the bundle
        if: steps.needs.outputs.needed == 'true'
        shell: Rscript {0}
        run: |
          dir <- Sys.getenv("GSM_TESTDATA_SNAPSHOT")
          stopifnot(nzchar(dir), file.exists(file.path(dir, "snapshot.json")))
          snap <- jsonlite::read_json(file.path(dir, "snapshot.json"))
          cat("GSM_TESTDATA_SNAPSHOT:", dir, "\nfingerprint:", snap$metadata$fingerprint, "\n")
          stopifnot(gsm.core::testdata_is_available())
          str(gsm.core::lSource, max.level = 1)
      - name: Check package
        uses: gilead-public/gsm.utils/check-r-package@actions-v1
        with:
          error-on: ${{ matrix.config.error-on || '"warning"' }}
